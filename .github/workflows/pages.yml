# Builds every talks/*/talk.md with scripts/build.sh and the theme of this branch, and publishes the talks on
# GitHub Pages, at each push on main (scripts/publish.sh moves a draft to talks/ and pushes).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the talks
        run: |
          npm ci
          for md in talks/*/talk.md; do bash scripts/build.sh "$md"; done
          # The site: each talk (page and figures), the shared files at their paths, and the font
          site=site; mkdir -p "$site/theme"
          for dir in talks/*/; do
            mkdir -p "$site/$dir"; cp "$dir/talk.html" "$site/$dir"
            if [ -d "$dir/figures" ]; then cp -r "$dir/figures" "$site/$dir"; fi
          done
          cp -r media projects logos team "$site/"
          cp -r theme/fonts "$site/theme/"
          # The root of the site sends to the list of talks, the README of the repository
          echo '<meta http-equiv="refresh" content="0; url=https://github.com/VikVador/Talks">' > "$site/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
