# Builds every talks/*/talk.md with Marp and publishes it on GitHub Pages, at each push on main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the talks
        run: |
          mkdir -p site
          cp -r media theme site/
          for md in talks/*/talk.md; do
            dir=$(dirname "$md")
            mkdir -p "site/$dir"
            if [ -d "$dir/figures" ]; then cp -r "$dir/figures" "site/$dir/"; fi
            npx --yes @marp-team/marp-cli@4.5.1 --no-stdin --html --allow-local-files --theme-set theme -o "site/$dir/talk.html" -- "$md"
            # The play/pause bar of the videos, as scripts/build.sh of Talks-template adds it
            node -e 'const fs = require("fs"), [out, js] = process.argv.slice(1); const html = fs.readFileSync(out, "utf8"); fs.writeFileSync(out, html.replace("</body>", "<script>\n" + fs.readFileSync(js, "utf8") + "\n</script></body>"));' "site/$dir/talk.html" theme/video-controls.js
          done
          # The root of the site sends to the list of talks, the README of the repository
          echo '<meta http-equiv="refresh" content="0; url=https://github.com/VikVador/Talks">' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
