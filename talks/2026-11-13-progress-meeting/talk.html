<h1 id="progress">Progress</h1>
<p>Since our last meeting, here is what we worked on:</p>
<ul>
<li><strong>Encoders</strong>: the <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.579ex" role="img" focusable="false" viewBox="0 -676 500 698"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="37" d="M55 458Q56 460 72 567L88 674Q88 676 108 676H128V672Q128 662 143 655T195 646T364 644H485V605L417 512Q408 500 387 472T360 435T339 403T319 367T305 330T292 284T284 230T278 162T275 80Q275 66 275 52T274 28V19Q270 2 255 -10T221 -22Q210 -22 200 -19T179 0T168 40Q168 198 265 368Q285 400 349 489L395 552H302Q128 552 119 546Q113 543 108 522T98 479L95 458V455H55V458Z"></path></g></g></g></svg></mjx-container> encoders, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.507ex" role="img" focusable="false" viewBox="0 -666 500 666"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container> for GLORYS and <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 500 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="36" d="M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 37 <li><strong>Latents</strong>: every dataset is encoded, with its statistics computed.</li>
<li><strong>Experiment</strong>: a study to assess whether the observations are <em>helpful</em>, now training*.</li>
</ul>
<div class="footnote">
<p>* Note: we assume it is already worth showing in the latent space whether the observations help, even though a decoder would also let us see it on the fields.</p>

<h2 id="scientific-question">Scientific question</h2>
<p>In the latent space, does a model given the <strong>surface observations</strong> predict the states of a block of days <strong>better than the same model without them</strong>, both knowing the states on each side of the block?</p>

<h2 id="whats-next">What's next</h2>
<ul>
<li><strong>Observations</strong>: do they help locally, and up to which block size?</li>
<li><strong>Decoder</strong>: a GLORYS decoder, to score in physical space and tell the surface from the depth.</li>
<li><strong>GiBBS</strong>: sample the global state with the learned local posterior.</li>
</ul>

<h1 id="progress">Progress</h1>
<p>Since our last meeting, here is what we worked on:</p>
<ul>
<li><strong>Encoders</strong>: the three encoders, surface, ocean and ERA5, are trained.</li>
<li><strong>Latents</strong>: the whole dataset, 1998–2022, is encoded, and its statistics are computed.</li>
<li><strong>Decoders</strong>: the surface decoder is trained (MSE), the ocean decoder waits*.</li>
<li><strong>Processor</strong>: <em>experimenting</em> to find a good baseline for the prototype.</li>
</ul>
<div class="footnote">* Our fair-share on Lucia makes jobs wait for hours…</div>
</section>

<h2 id="processor">Processor</h2>
<p>The design of the processor will shape every forecast of the emulator. Before scaling it up, we studied two of its choices: the <em>attention mechanism</em>, which tokens read each other, and the <em>target</em>, what the network outputs.</p>

<p>In each block, every token updates itself by reading other tokens. In one day, a current only travels <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.581ex" role="img" focusable="false" viewBox="0 -677 1000 699"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container> to <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 1000 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="39" d="M352 287Q304 211 232 211Q154 211 104 270T44 396Q42 412 42 436V444Q42 537 111 606Q171 666 243 666Q245 666 249 666T257 665H261Q273 665 286 663T323 651T370 619T413 560Q456 472 456 334Q456 194 396 97Q361 41 312 10T208 -22Q147 -22 108 7T68 93T121 149Q143 149 158 135T173 96Q173 78 164 65T148 49T135 44L131 43Q131 41 138 37T164 27T206 22H212Q272 22 313 86Q352 142 352 280V287ZM244 248Q292 248 321 297T351 430Q351 508 343 542Q341 552 337 562T323 588T293 615T246 625Q208 625 181 598Q160 576 154 546T147 441 <h2 id="decoders">Decoders</h2>
<p>We train <strong>decoders</strong>, from the latents back to the <em>physical fields</em>; so far, only the surface decoder is trained. It mirrors the encoder, with wider channels in its two deepest stages, and is trained on 1998–2017 with a mean squared error averaged per variable and level over the sea.</p>
</section>

<h2 id="whats-next">What's next</h2>
<ul>
<li><strong>Position</strong>: the absolute embedding against RoPE, running now.</li>
<li><strong>Full training</strong>: a larger processor on the 20 training years.</li>
<li><strong>Decoders</strong>: the ocean decoder, then a fine-tuning on latents noised like the processor's error.</li>
<li><strong>Rollout</strong>: a multi-step fine-tuning, to keep 10-day trajectories stable.</li>
</ul>

<h1 id="neural-emulator-of-black-sea-dynamics">Poseidon</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="reef" data-lang="en" lang="en" data-marpit-pagination="32" style="--paginate:true;--theme:reef;--lang:en;" data-marpit-pagination-total="45">
<h1 id="introduction">Introduction</h1>
<p>We redid the experiments of the paper* with a <strong>vision transformer</strong> (instead of a U-Net), to verify our results, learn how to design transformers, and get ideas for the <em>assimilation module of Neptune</em>. Three of the most interesting observations:</p>
<ul>
<li><strong>Compression of the tokens</strong>: how wide the transformer must be for its data.</li>
<li><strong>Loss weighting</strong>: which voxels of water the loss should favour.</li>
<li><strong>Retraining the prior</strong>: the chosen model, on <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 1000 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container> years of data.</li>
</ul>
<div class="footnote">* Mangeleer et al., <a href="https://arxiv.org/abs/2604.25608">The physical limit of neural hypoxia detection in the Black Sea from satellite observations</a>, 2026.</div>

<h2 id="loss-weighting">Loss weighting</h2>
<p>We test three ways of <strong>weighting the loss</strong> between the voxels of water: <b style="color:#E69F00">None</b>, where each voxel counts the same, <b style="color:#0072B2">Level</b>, where each depth level counts the same, and <b style="color:#009E73">Column</b>, where each water column counts the same.</p>
</section>

<h2 id="summary">Summary</h2>
<div class="grid summary">
<div class="key">
<p><strong>Key results</strong></p>
<ol>
<li>No compression of the tokens is the best; widening them again after a compression creates no information.</li>
<li>The weighting per level of the paper does worse than none or per water column.</li>
</ol>
</div>
</div>
</section>

<h2 id="whats-next">What's next</h2>
<ul>
<li><strong>Prior samples</strong>: judge the retrained prior on its generations once trained, maps first.</li>
<li><strong>Posterior</strong>: MMPS on validation then test, with skill, spread and SSR per depth.</li>
<li><strong>Hypoxia</strong>: check the gain of the Column weighting at the bottom of the shelf, where hypoxia forms.</li>
</ul>
</section>

<script>
// The frames of a figure play like the recap videos: round button bottom-left, a bar to pick a day, one day per second.
(function () {
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>';
  function init() {
    document.querySelectorAll(".frames").forEach(box => {
      const imgs = [...box.querySelectorAll("img")];
      const section = box.closest("section");
      const dock = document.createElement("div"); dock.className = "vdock";
      const btn = document.createElement("button"); btn.className = "vctl"; btn.type = "button"; btn.setAttribute("aria-label", "Play or pause the days");
      const bar = document.createElement("div"); bar.className = "vbar";
      bar.innerHTML = '<div class="track"><div class="fill"></div><div class="knob"></div></div><span class="time"></span>';
      const track = bar.querySelector(".track"), fill = bar.querySelector(".fill"), knob = bar.querySelector(".knob"), time = bar.querySelector(".time");
      let k = 0, timer = null;
      const draw = () => { const f = imgs.length > 1 ? k / (imgs.length - 1) : 0; fill.style.width = knob.style.left = (100 * f) + "%"; time.textContent = imgs[k].dataset.date + "  (" + (k + 1) + " / " + imgs.length + ")"; };
      const show = i => { imgs[k].classList.remove("on"); k = i; imgs[k].classList.add("on"); draw(); };
      const paint = () => { btn.innerHTML = timer ? ICON_PAUSE : ICON_PLAY; };
      const stop = () => { clearInterval(timer); timer = null; paint(); };
      const play = () => { if (k === imgs.length - 1) show(0); timer = setInterval(() => { if (k === imgs.length - 1) { stop(); return; } show(k + 1); }, 1000); paint(); };
      const seek = e => { const r = track.getBoundingClientRect(); const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); show(Math.round(f * (imgs.length - 1))); };
      btn.addEventListener("mousedown", e => e.preventDefault());
      btn.addEventListener("click", e => { e.stopPropagation(); e.preventDefault(); btn.blur(); timer ? stop() : play(); });
      bar.addEventListener("mousedown", e => {
        e.preventDefault(); e.stopPropagation(); dock.classList.add("drag"); seek(e);
        const mv = ev => seek(ev);
        const up = () => { dock.classList.remove("drag"); removeEventListener("mousemove", mv); removeEventListener("mouseup", up); };
        addEventListener("mousemove", mv); addEventListener("mouseup", up);
      });
      bar.addEventListener("click", e => e.stopPropagation());
      dock.append(btn, bar); section.appendChild(dock); paint(); draw();
      // Back to the first day, paused, when the slide is left
      new MutationObserver(() => { const host = box.closest("svg[data-marpit-svg]") || section; if (!host.closest(".bespoke-marp-active") && (timer || k)) { stop(); show(0); } })
        .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>

// Recap videos (video.full on slides with class `video`):
// - restart when their slide is entered, pause when it is left;
// - play/pause button bottom-left (a click on the video toggles too);
// - a seek bar that appears when the mouse is over the button area: click or drag to jump.
// Arrow keys keep changing slides after a click (focus is never kept on the controls).
// Injected into every built deck by scripts/build.sh; styles are in theme/base.css (.vdock, .vctl, .vbar).
(function () {
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>';
  const fmt = x => { x = Math.max(0, Math.floor(x || 0)); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };

  function init() {
    const videos = [...document.querySelectorAll('section video.full')];
    videos.forEach(v => {
      const dock = document.createElement('div'); dock.className = 'vdock';
      const btn = document.createElement('button');
      btn.className = 'vctl'; btn.type = 'button'; btn.setAttribute('aria-label', 'Play or pause the animation');
      const bar = document.createElement('div'); bar.className = 'vbar';
      bar.innerHTML = '<div class="track"><div class="fill"></div><div class="knob"></div></div><span class="time">0:00</span>';
      const track = bar.querySelector('.track'), fill = bar.querySelector('.fill'),
            knob = bar.querySelector('.knob'), time = bar.querySelector('.time');

      const paint = () => { btn.innerHTML = v.paused ? ICON_PLAY : ICON_PAUSE; };
      const toggle = e => { e.stopPropagation(); e.preventDefault(); v.paused ? v.play().catch(() => {}) : v.pause(); btn.blur(); };
      const draw = () => {
        const f = v.duration ? v.currentTime / v.duration : 0;
        fill.style.width = knob.style.left = (100 * f) + '%';
        time.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
      };
      const loop = () => { draw(); if (!v.paused) requestAnimationFrame(loop); };
      // The slide may be scaled: use the track's on-screen box.
      const seek = e => {
        const r = track.getBoundingClientRect();
        const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        if (v.duration) v.currentTime = f * v.duration;
        draw();
      };
      bar.addEventListener('mousedown', e => {
        e.preventDefault(); e.stopPropagation(); dock.classList.add('drag'); seek(e);
        const mv = ev => seek(ev);
        const up = () => { dock.classList.remove('drag'); removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
        addEventListener('mousemove', mv); addEventListener('mouseup', up);
      });
      bar.addEventListener('click', e => e.stopPropagation());
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', toggle);
      v.addEventListener('click', toggle);
      v.addEventListener('play', () => { paint(); loop(); });
      v.addEventListener('pause', () => { paint(); draw(); });
      v.addEventListener('seeked', draw);
      v.addEventListener('loadedmetadata', draw);
      paint();
      dock.append(btn, bar);
      v.parentNode.appendChild(dock);
    });

    // Restart a video when its slide becomes active, pause it when the slide is left.
    const sync = () => videos.forEach(v => {
      const host = v.closest('svg[data-marpit-svg]') || v.closest('section');
      const active = !!(host && host.closest('.bespoke-marp-active'));
      if (active && !v._active) { v.currentTime = 0; v.play().catch(() => {}); }
      if (!active && v._active) v.pause();
      v._active = active;
    });
    new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
